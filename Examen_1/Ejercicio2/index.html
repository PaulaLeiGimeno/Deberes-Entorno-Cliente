<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <title>Ejercicio 2</title>
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <div id="page">
        <section style="text-align: center;">
            <h1>Insert Character</h1>
            <div class="content">
                <form>
                    <input type="text" name="name" placeholder="Nombre" required autofocus><br>
                    <div id='render'>
                        <button type="submit">BUSCAR</button>
                    </div>
                </form>
            </div>
        </section>

        <div class="photo">

                <img
                    src="https://upload.wikimedia.org/wikipedia/commons/6/6c/Star_Wars_Logo.svg">
            </div>
            <span class="caption">Nombre personaje</span>
            <p class="title">Title</p>
            <p class="opening_crawl">Opening crawl</p>
        </div>

    </div>

    <script src="ejercicio2.js"></script>
</body>
